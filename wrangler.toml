# Cloudflare Pages configuration (used by both `wrangler pages deploy` and
# Git-connected builds). The only server-side code is functions/donate/[org].ts.
name = "qrcode666"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Anonymous donation-link click counts (see migrations/).
[[d1_databases]]
binding = "DONATIONS_DB"
database_name = "qrcode666-donations"
database_id = "b5b62d04-9f52-43a0-8b42-9a890587f247"
migrations_dir = "migrations"
